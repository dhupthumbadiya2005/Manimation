# Known failure patterns -> hint for the Fixer. Matched (regex, case-insensitive)
# against validator/render errors. Free to evaluate; saves the model a guess.
- pattern: "NameError: name '(ShowCreation|TextMobject|TexMobject|GraphScene|ShowCreationThenDestruction)'"
  hint: "ManimGL name. Use the Manim CE equivalent: Create, Text, MathTex, Axes, ShowPassingFlash."
- pattern: "LaTeX compilation error|latex error converting to dvi"
  hint: "A MathTex/Tex string does not compile. Check unbalanced braces, $ inside MathTex, \\text{} for words, and unescaped % or &. Look at the TeX source line in the log."
- pattern: "Missing \\$ inserted"
  hint: "Math symbols inside Tex (text mode). Use MathTex, or wrap math in $...$ inside Tex."
- pattern: "has no attribute 'get_graph'"
  hint: "Axes.get_graph was renamed: use axes.plot(func, x_range=[a, b])."
- pattern: "has no attribute 'get_graph_label'"
  hint: "Use axes.get_graph_label(graph, label=MathTex(...)) only on Axes in CE >= 0.15, or place a MathTex with next_to."
- pattern: "unexpected keyword argument 'x_min'|unexpected keyword argument 'x_max'"
  hint: "CE uses x_range=[min, max, step] instead of x_min/x_max."
- pattern: "has no attribute 'frame'"
  hint: "self.camera.frame only exists in MovingCameraScene. Do not move the camera; scale/move mobjects instead."
- pattern: "IndexError: list index out of range"
  hint: "Indexing a MathTex part or VGroup element that does not exist. Separate args / {{ }} define parts; print nothing, just count parts in the TeX string."
- pattern: "TypeError: .*__init__\\(\\) got an unexpected keyword argument"
  hint: "That keyword does not exist in Manim CE for this class. Remove it or use the CE parameter name."
- pattern: "text_overlap"
  hint: "Two texts overlap. Move one to another zone, use stack(...)/next_to(...) or FadeOut the old one before adding the new."
- pattern: "out_of_frame"
  hint: "Object leaves the frame. Wrap with place_in_zone(mob, ZONE) after building it, or reduce its size."
- pattern: "text_too_small"
  hint: "Increase font_size (Text >= 28, MathTex >= 36) or give it its own zone so place_in_zone does not shrink it."
